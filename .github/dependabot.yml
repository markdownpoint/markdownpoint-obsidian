version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '06:00'
      timezone: Europe/Stockholm
    groups:
      npm-dependencies:
        patterns:
          - '*'
      # Group security fixes so one merge does not leave the other fixes behind main.
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # The CodeMirror packages match the versions Obsidian bundles; the plugin never ships them.
      - dependency-name: '@codemirror/*'
      # The API declarations stay at the minimum supported Obsidian version in manifest.json.
      - dependency-name: obsidian
      # Slide markers must be read with the MarkdownPoint app's exact Marked version; it moves only with the app.
      - dependency-name: marked
      # typescript-eslint 8 requires typescript <6.1.0, so a major typescript bump fails to install.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: '06:30'
      timezone: Europe/Stockholm
    groups:
      github-actions:
        patterns:
          - '*'
    open-pull-requests-limit: 5
